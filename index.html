<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Les 42,5 ans d'Agnès 🎉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --grad1:#6a3093; --grad2:#c454b7; --grad3:#f6a15a;
    --gold:#f6c453; --ink:#2c1a3d; --paper:#fffdf8;
    --ok:#2ecc71; --off:#e67e22; --danger:#e74c3c;
    --radius:18px; --shadow:0 8px 24px rgba(44,26,61,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito',-apple-system,BlinkMacSystemFont,sans-serif;
    background:linear-gradient(160deg,var(--grad1),var(--grad2) 55%,var(--grad3));
    background-attachment:fixed;
    min-height:100vh;
    color:var(--ink);
    padding-bottom:84px;
  }
  h1,h2,h3,.title-font{font-family:'Baloo 2',sans-serif;}
  #topbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;background:rgba(44,26,61,.35);backdrop-filter:blur(6px);
    color:#fff;font-family:'Baloo 2',sans-serif;font-weight:700;
  }
  #topbar .t{font-size:15px;display:flex;align-items:center;gap:8px;cursor:pointer;}
  .syncpill{font-size:11px;padding:4px 9px;border-radius:20px;background:rgba(255,255,255,.18);white-space:nowrap;}
  .syncpill.live{background:rgba(46,204,113,.35);}
  .syncpill.local{background:rgba(230,126,34,.35);}
  #app{max-width:520px;margin:0 auto;padding:16px;}
  .card{
    background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:18px;margin-bottom:16px;
  }
  .hero{
    text-align:center;color:#fff;padding:18px 6px 8px;
  }
  .hero img{
    width:min(440px, 82vw);height:min(440px, 82vw);object-fit:cover;border-radius:50%;
    border:8px solid var(--gold);box-shadow:0 14px 34px rgba(0,0,0,.45);
    margin-bottom:18px;
  }
  .hero h1{font-size:36px;margin:0 0 12px;text-shadow:0 3px 10px rgba(0,0,0,.3);}
  .hero p{font-size:19px;opacity:.95;line-height:1.6;}
  .hero p b{font-size:22px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;
    padding:13px 18px;border-radius:14px;border:none;cursor:pointer;
    text-decoration:none;width:100%;margin-top:10px;
    background:var(--gold);color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.2);
    transition:transform .1s;
  }
  .btn:active{transform:scale(.97);}
  .btn.secondary{background:#fff;color:var(--grad1);}
  .btn.outline{background:transparent;border:2px solid #fff;color:#fff;box-shadow:none;}
  .btn.small{width:auto;padding:9px 14px;font-size:13px;margin-top:0;}
  .btn.danger{background:var(--danger);color:#fff;}
  .btn.ok{background:var(--ok);color:#fff;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .defi-card{
    background:var(--paper);border-radius:16px;padding:16px 10px;text-align:center;
    box-shadow:var(--shadow);cursor:pointer;text-decoration:none;color:var(--ink);
    display:block;border:3px solid transparent;
  }
  .defi-card .emoji{font-size:34px;display:block;margin-bottom:6px;}
  .defi-card .nom{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;}
  .defi-card .pts{font-size:11px;opacity:.65;margin-top:2px;}
  .section-title{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:19px;margin:6px 0 12px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.25);}
  .badge{
    display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;
    font-weight:700;font-size:13px;color:#fff;
  }
  .rules-box{background:#f6f1fb;border-left:4px solid var(--grad1);padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.6;margin:10px 0;}
  .bareme-box{background:#fff7e6;border-left:4px solid var(--gold);padding:12px 14px;border-radius:10px;font-size:13.5px;line-height:1.65;margin:10px 0;}
  .team-btn{
    display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;
    margin-bottom:8px;cursor:pointer;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;
    border:3px solid transparent;color:var(--ink);
  }
  .team-btn.selected{border-color:var(--ink);}
  .team-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;}
  .rank-row{
    display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;margin-bottom:8px;background:#faf7fd;
  }
  .rank-row.me{outline:3px solid var(--grad1);background:#f1e6fb;}
  .rank-num{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;width:30px;text-align:center;}
  .rank-num.top1{color:#e0a800;}
  .rank-num.top2{color:#9aa0a6;}
  .rank-num.top3{color:#b5651d;}
  .rank-name{flex:1;font-weight:700;font-family:'Baloo 2',sans-serif;font-size:15px;}
  .rank-pts{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px;}
  details.breakdown{margin-top:8px;font-size:12.5px;}
  details.breakdown summary{cursor:pointer;color:var(--grad1);font-weight:700;}
  .bd-line{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dashed #ddd;}
  .stepdots{display:flex;gap:6px;margin:10px 0;}
  .stepdot{width:16px;height:16px;border-radius:50%;background:#e2d8ee;}
  .stepdot.done{background:var(--ok);}
  .stepdot.current{background:var(--gold);box-shadow:0 0 0 3px rgba(246,196,83,.4);}
  #bottomnav{
    position:fixed;bottom:0;left:0;right:0;z-index:30;
    background:rgba(44,26,61,.92);backdrop-filter:blur(8px);
    display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  #bottomnav .navitem{
    background:none;border:none;color:#cbb9e0;display:flex;flex-direction:column;align-items:center;
    font-size:10px;gap:2px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;padding:4px 8px;
  }
  #bottomnav .navitem.active{color:#fff;}
  #bottomnav .navitem .ic{font-size:19px;}
  label{display:block;font-weight:700;font-size:12.5px;margin:10px 0 4px;color:#6a4a85;}
  input[type=text],input[type=number],input[type=password],textarea,input[type=color]{
    width:100%;padding:10px 12px;border-radius:10px;border:2px solid #e6def2;font-size:14px;font-family:inherit;
  }
  textarea{resize:vertical;min-height:52px;}
  .row{display:flex;gap:10px;align-items:center;}
  .row>*{flex:1;}
  .tabbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .tabbar button{
    border:none;padding:8px 12px;border-radius:20px;font-size:12.5px;font-weight:700;cursor:pointer;
    background:#eee2f7;color:var(--grad1);
  }
  .tabbar button.active{background:var(--grad1);color:#fff;}
  .team-admin-card{border:2px solid #eee2f7;border-radius:14px;padding:12px;margin-bottom:12px;}
  .team-admin-card h4{margin:0 0 8px;font-family:'Baloo 2',sans-serif;display:flex;align-items:center;gap:8px;}
  .checkline{display:flex;align-items:center;gap:8px;margin:8px 0;font-weight:700;font-size:13.5px;}
  .checkline input{width:20px;height:20px;}
  .muted{color:#8a7a99;font-size:12.5px;}
  .center{text-align:center;}
  .qrbox{background:#fff;padding:12px;border-radius:14px;display:inline-block;}
  .totalbig{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:26px;color:var(--grad1);text-align:center;}
  a{color:inherit;}
  .link-note{font-size:11px;word-break:break-all;background:#f6f1fb;padding:8px;border-radius:8px;}
  .flash{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:9px 16px;border-radius:20px;font-size:13px;font-weight:700;z-index:50;box-shadow:0 6px 16px rgba(0,0,0,.3);}
  canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:5;}
</style>
</head>

<canvas id="confetti"></canvas>
<div id="topbar">
  <div class="t" onclick="nav('/')">🎂 <span id="topbar-title">Les 42,5 ans d'Agnès</span></div>
  <div class="syncpill" id="syncpill">…</div>
</div>
<div id="app"></div>
<nav id="bottomnav"></nav>

    v:4,
    titre:"Les 42,5 ans d'Agnès",
    pin:"4225",
    teams: JSON.parse(JSON.stringify(DEFAULT_TEAMS)),
    contenu:{
      apero: Object.assign({}, DEFAULT_APERO_DEFIS),
      cocktailBase: DEFAULT_COCKTAIL_BASE.slice(),
      cocktailBonus: DEFAULT_COCKTAIL_BONUS,
      quizInfo: DEFAULT_QUIZ_INFO,
      blindtestInfo: DEFAULT_BLINDTEST_INFO,
    },
    scores: defaultScoresForTeams(DEFAULT_TEAMS),
    sync:{mode:'local', bucket:null, role:'guest', updatedAt:0, fbProject:'', fbKey:''},
  };
}

// Migration : ancien barème (corde = victoire unique, quiz = pourcentage saisi)
// vers le nouveau (corde = 2 manches, quiz = nombre de bonnes réponses /20).
// Conserve les scores déjà saisis sans les faire sauter.
function migrateState(s){
  if(!s || !s.scores) return s;
  if(s.v===3){
    Object.keys(s.scores).forEach(id=>{
      const sc = s.scores[id];
      if(sc && typeof sc.corde === 'boolean'){
        sc.corde = { manche1: sc.corde, manche2:false };
      }
      if(sc && typeof sc.quiz === 'number'){
        sc.quiz = Math.round(sc.quiz/100*20);
      }
    });
    s.v = 4;
  }
  // filet de sécurité si jamais un score corde arrive encore sous l'ancienne forme
  Object.keys(s.scores).forEach(id=>{
    const sc = s.scores[id];
    if(sc && typeof sc.corde === 'boolean'){
      sc.corde = { manche1: sc.corde, manche2:false };
    }
  });
  // Migration : tir à la corde passe de "manche gagnée" (booléen) à un résultat
  // à 3 issues (victoire/nul/défaite), et le défi photo passe d'une simple
  // validation (booléen) à un classement (rang) par catégorie.
  Object.keys(s.scores).forEach(id=>{
    const sc = s.scores[id];
    if(!sc) return;
    if(sc.corde){
      ['manche1','manche2'].forEach(m=>{
        if(typeof sc.corde[m] === 'boolean'){
          sc.corde[m] = sc.corde[m] ? 'victoire' : null;
        }
      });
    }
    if(typeof sc.photo === 'boolean'){
      if(sc.photoRang===undefined || sc.photoRang===null) sc.photoRang = null;
      delete sc.photo;
    }
    if(sc.photoRang===undefined) sc.photoRang = null;
  });
  // Filet de sécurité : toute équipe de la liste courante sans entrée de score
  // (état corrompu/incomplet) reçoit un score par défaut plutôt que de faire
  // planter l'affichage.
  (s.teams||[]).forEach(t=>{
    if(!s.scores[t.id]) s.scores[t.id] = defaultScoresForTeams([t])[t.id];
  });
  // Recalage de la liste des équipes : si la liste d'équipes courante (DEFAULT_TEAMS)
  // a changé (renommage/ajout/suppression d'équipes), on la resynchronise tout en
  // conservant les scores déjà saisis pour les équipes qui existent encore.
  const currentIds = DEFAULT_TEAMS.map(t=>t.id);
  const savedIds = (s.teams||[]).map(t=>t.id);
  const rosterChanged = currentIds.length !== savedIds.length || currentIds.some(id=>!savedIds.includes(id));
  if(rosterChanged){
    const oldTeamsById = {};
    (s.teams||[]).forEach(t=>{ oldTeamsById[t.id] = t; });
    const oldScores = s.scores || {};
    const oldApero = (s.contenu && s.contenu.apero) || {};
    s.teams = DEFAULT_TEAMS.map(t => oldTeamsById[t.id]
      ? { ...t, nom: oldTeamsById[t.id].nom, couleur: oldTeamsById[t.id].couleur, emoji: oldTeamsById[t.id].emoji }
      : { ...t });
    const freshScores = defaultScoresForTeams(DEFAULT_TEAMS);
    const newScores = {};
    currentIds.forEach(id => { newScores[id] = oldScores[id] || freshScores[id]; });
    s.scores = newScores;
    s.contenu = s.contenu || {};
    const newApero = {};
    currentIds.forEach(id => { newApero[id] = (oldApero[id] !== undefined) ? oldApero[id] : (DEFAULT_APERO_DEFIS[id] || ''); });
    s.contenu.apero = newApero;
  }
  // Recale toujours la catégorie (enfant/adulte) sur la liste de référence,
  // même quand la liste d'équipes elle-même n'a pas changé (ex: correction
  // de la répartition Enfants/Adultes) — nom/couleur restent modifiables.
  const catById = {};
  DEFAULT_TEAMS.forEach(t=>{ catById[t.id] = t.categorie; });
  (s.teams||[]).forEach(t=>{ if(catById[t.id]) t.categorie = catById[t.id]; });

  // Corrige les textes restés bloqués sur une ancienne version par défaut
  // (ces champs sont copiés dans le state au premier chargement, donc une
  // mise à jour du texte par défaut ne les touchait plus automatiquement).
  // On ne remplace QUE si le texte sauvegardé correspond à une ancienne
  // version connue, pour ne jamais écraser une modif volontaire de Jessica.
  const OLD_BLINDTEST_INFOS = [
    "Un blind test musical : 20 extraits pour les équipes adultes, 10 extraits pour les équipes enfants. Notez vos réponses sur papier — chaque bonne réponse rapporte 1 point.",
    "Un blind test musical : 20 extraits pour les équipes adultes, 10 extraits pour les équipes enfants. Votre équipe doit désigner son champion (1 personne) pour répondre à ce défi. Notez vos réponses sur papier — chaque bonne réponse rapporte 1 point.",
    "Un blind test musical : 20 extraits pour les équipes adultes, 10 extraits pour les équipes enfants. Votre équipe doit désigner son ou sa spécialiste, celui ou celle qui rapportera le plus de points, pour répondre à ce défi. Notez vos réponses sur papier — chaque bonne réponse rapporte 1 point.",
    "Un blind test musical : 20 extraits pour les équipes adultes, 10 extraits pour les équipes enfants. Votre équipe doit désigner son champion pour ce défi — chaque bonne réponse rapporte 1 point.",
  ];
  if(s.contenu && OLD_BLINDTEST_INFOS.includes(s.contenu.blindtestInfo)){
    s.contenu.blindtestInfo = DEFAULT_BLINDTEST_INFO;
  }
  const OLD_QUIZ_INFOS = [
    "Un questionnaire sur la vie d'Agnès (et un peu de culture générale). À remplir en équipe sur papier — l'organisatrice saisit ensuite le pourcentage de bonnes réponses.",
    "Un questionnaire sur la vie d'Agnès. À remplir en équipe sur papier — l'organisatrice saisit ensuite le pourcentage de bonnes réponses.",
    "Un questionnaire de 20 questions sur la vie d'Agnès. À remplir en équipe sur papier — Jessica saisit ensuite le nombre de bonnes réponses.",
    "Un questionnaire de 20 questions sur la vie d'Agnès. À remplir en équipe sur papier.",
    "Un questionnaire de 20 questions sur la vie de Robin. À remplir en équipe sur papier.",
  ];
  if(s.contenu && OLD_QUIZ_INFOS.includes(s.contenu.quizInfo)){
    s.contenu.quizInfo = DEFAULT_QUIZ_INFO;
  }
  const OLD_TITRES = ["Les 42,5 ans de Robin"];
  if(OLD_TITRES.includes(s.titre)){
    s.titre = "Les 42,5 ans d'Agnès";
  }
  const OLD_APERO_TEXTS = {
    pirates:   "Prendre les bancs et faire semblant de ramer. Simuler des vagues en se penchant tous ensemble : devant, à gauche, à droite... jusqu'à affronter une grosse tempête.",
    pokemon:   "Tirer des balles sur le trampoline pour toucher les Pokémon.",
    mariokart: "Se mettre en file et mimer une course de Mario Kart : volant, virages, dérapages, carapaces reçues... puis franchir la ligne d'arrivée tous ensemble.",
    fromages:  "Le haka de Montbrison : inventer un haka et le terminer tous ensemble en criant « MONT-BRI-SON ! »",
    asse:      "Faire une ola à tout le monde.",
  };
  if(s.contenu && s.contenu.apero){
    Object.keys(OLD_APERO_TEXTS).forEach(id=>{
      if(s.contenu.apero[id] === OLD_APERO_TEXTS[id]) s.contenu.apero[id] = DEFAULT_APERO_DEFIS[id];
    });
  }
  return s;
}

function loadLocal(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    let parsed = JSON.parse(raw);
    if(!parsed) return null;
    if(parsed.v===3 || parsed.v===4) parsed = migrateState(parsed);
    if(parsed.v!==4) return null;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
    return parsed;
  }catch(e){ return null; }
}
function saveLocal(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){} }

let STATE = loadLocal() || defaultState();

/* =========================================================
   BARÈME / CALCUL DES POINTS
========================================================= */
function ptsApero(sc){ return sc.apero.valide ? 5 : 0; }
function ptsPhoto(sc, team){
  const rang = sc.photoRang;
  if(!rang || !team) return 0;
  const n = STATE.teams.filter(x=>x.categorie===team.categorie).length;
  return Math.max(0, n - rang + 1);
}
function ptsCorde(sc){
  const c = sc.corde||{};
  const mchPts = v => v==='victoire' ? 3 : v==='nul' ? 1 : 0;
  return mchPts(c.manche1) + mchPts(c.manche2);
}
function ptsQuiz(sc){
  const n = sc.quiz;
  if(n===null || n===undefined || n==='') return 0;
  return Number(n); // 1 pt / bonne réponse, sur 20
}
function ptsBlindtest(sc){ return (sc.blindtest===null || sc.blindtest===undefined || sc.blindtest==='') ? 0 : Number(sc.blindtest); }
function ptsCocktail(sc){ return Math.min(sc.cocktail.ingredients||0,5)*1 + (sc.cocktail.bonus?3:0); }
function ptsTotal(team){
  const sc = STATE.scores[team.id];
  return ptsApero(sc)+ptsPhoto(sc,team)+ptsCorde(sc)+ptsQuiz(sc)+ptsBlindtest(sc)+ptsCocktail(sc);
}

function pointsBreakdown(team){
  const sc = STATE.scores[team.id];
  return [
    {id:'apero', label:'Défi apéro', pts:ptsApero(sc)},
    {id:'photo', label:'Photo', pts:ptsPhoto(sc,team)},
    {id:'corde', label:'Tir à la corde', pts:ptsCorde(sc)},
    {id:'quiz', label:'Questionnaire', pts:ptsQuiz(sc)},
    {id:'blindtest', label:'Blind test', pts:ptsBlindtest(sc)},
    {id:'cocktail', label:'Cocktail', pts:ptsCocktail(sc)},
  ];
}

/* =========================================================
   SYNCHRO EN DIRECT (Firebase Firestore REST) + repli local
   -> Firestore est utilisé (plutôt qu'un service anonyme type
      kvdb.io) car son support CORS pour un appel direct depuis
      le navigateur est officiel et documenté par Google, donc
      fiable le jour J. Nécessite un projet Firebase gratuit
      (voir onglet Partage pour les instructions).
========================================================= */
function fbReady(){ return !!(STATE.sync.fbProject && STATE.sync.fbKey); }
function fbDocUrl(gameId){
  return `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(STATE.sync.fbProject)}/databases/(default)/documents/agnes425parties/${encodeURIComponent(gameId)}?key=${encodeURIComponent(STATE.sync.fbKey)}`;
}
function fbEncode(state){
  return { fields: { json: { stringValue: JSON.stringify(state) } } };
}
async function kvCreateBucket(){
  if(!fbReady()) throw new Error("Renseigne d'abord l'ID de projet et la clé API Firebase");
  const id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  let res;
  try{
    res = await fetch(fbDocUrl(id), {
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(fbEncode({}))
    });
  }catch(e){ throw new Error('Réseau/CORS : '+e.message); }
  if(!res.ok){
    const txt = await res.text().catch(()=> '');
    throw new Error('HTTP '+res.status+' — '+txt.slice(0,140));
  }
  return id;
}
async function kvPush(){
  if(!STATE.sync.bucket || !fbReady()) return false;
  try{
    const res = await fetch(fbDocUrl(STATE.sync.bucket), {
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(fbEncode(STATE))
    });
    return res.ok;
  }catch(e){ return false; }
}
async function kvPull(bucket){
  if(!fbReady()) return null;
  try{
    const res = await fetch(fbDocUrl(bucket), {cache:'no-store'});
    if(!res.ok) return null;
    const data = await res.json();
    const str = data && data.fields && data.fields.json && data.fields.json.stringValue;
    if(!str) return null;
    return JSON.parse(str);
  }catch(e){ return null; }
}

function persist(){
  saveLocal();
  if(STATE.sync.mode==='live' && STATE.sync.role==='admin' && STATE.sync.bucket){
    STATE.sync.updatedAt = Date.now();
    saveLocal();
    kvPush();
  }
}

let pollTimer=null;
function ensurePolling(){
  if(pollTimer) return;
  pollTimer = setInterval(async ()=>{
    if(document.hidden) return;
    if(STATE.sync.mode==='live' && STATE.sync.bucket && STATE.sync.role==='guest'){
      let remote = await kvPull(STATE.sync.bucket);
      if(remote) remote = migrateState(remote);
      if(remote && (remote.sync?.updatedAt||0) > (STATE.sync.updatedAt||0)){
        const myBucket = STATE.sync.bucket;
        STATE = remote;
        STATE.sync.bucket = myBucket;
        STATE.sync.role = 'guest';
        saveLocal();
        render();
      }
    }
  }, 4000);
}

let flashTimer=null;
function flash(msg){
  clearTimeout(flashTimer);
  let f = document.getElementById('flash');
  if(!f){ f=document.createElement('div'); f.id='flash'; f.className='flash'; document.body.appendChild(f); }
  f.textContent = msg;
  f.style.display='block';
  flashTimer=setTimeout(()=>{ f.style.display='none'; }, 2200);
}

/* =========================================================
   INIT (lien invité ?g=BUCKET&p=PROJET&k=CLE, sinon état local)
========================================================= */
async function init(){
  const params = new URLSearchParams(location.search);
  const g = params.get('g');
  const p = params.get('p');
  const k = params.get('k');
  if(g && p && k){
    STATE.sync.mode='live'; STATE.sync.role='guest'; STATE.sync.bucket=g;
    STATE.sync.fbProject=p; STATE.sync.fbKey=k;
    saveLocal();
    let remote = await kvPull(g);
    if(remote){
      remote = migrateState(remote);
      remote.sync = remote.sync || {};
      remote.sync.bucket=g; remote.sync.role='guest'; remote.sync.mode='live';
      remote.sync.fbProject=p; remote.sync.fbKey=k;
      STATE=remote; saveLocal();
    }
  }
  ensurePolling();
  render();
}

function renderDefiPage(id){
  const d = DEFIS_DEF.find(x=>x.id===id);
  if(!d) return `<div class="card">Défi introuvable. <a href="#/defis">Retour</a></div>`;
  const monEquipe = getMonEquipe();
  let html = `
  <div class="card">
    <div class="center" style="font-size:44px">${d.emoji}</div>
    <h2 class="center" style="margin:6px 0 14px">${d.nom}</h2>
    <div class="rules-box">${d.regles}</div>
    <div class="bareme-box">📊 Barème : ${d.bareme}</div>
  </div>`;

  if(id==='apero'){
    if(!monEquipe){
      html += `<div class="card center"><p class="muted">Choisissez votre équipe pour découvrir votre défi apéro.</p><button class="btn" onclick="nav('/equipe')">👥 Choisir mon équipe</button></div>`;
    } else {
      const sc = STATE.scores[monEquipe.id];
      const defiTxt = STATE.contenu.apero[monEquipe.id] || '';
      html += `<div class="card">
        <h3>Équipe : ${monEquipe.emoji} ${escapeHtml(monEquipe.nom)}</h3>`;
      if(sc.apero.valide){
        html += `<div class="bareme-box">🎉 Bravo, votre défi apéro est validé ! (+5 points)</div>
        <div class="rules-box">${escapeHtml(defiTxt)}</div>`;
      } else {
        html += `<div class="rules-box"><b>🎶 Votre défi apéro :</b><br>${escapeHtml(defiTxt)}</div>`;
      }
      html += `</div>`;
    }
  } else if(monEquipe){
    const bd = pointsBreakdown(monEquipe).find(b=>b.id===id);
    html += `<div class="card center"><span class="muted">Points de votre équipe (${monEquipe.emoji} ${escapeHtml(monEquipe.nom)}) sur ce défi :</span><div class="totalbig">${bd?bd.pts:'-'} pt${(bd&&bd.pts>1)?'s':''}</div></div>`;
  }
  return html;
}

/* =========================================================
   PAGE : CLASSEMENT
========================================================= */
let classementCat = 'adulte';
function setClassementCat(c){ classementCat=c; render(); }
function renderClassement(){
  const mon = getMonEquipe();
  const nbAdultes = STATE.teams.filter(t=>t.categorie==='adulte').length;
  const nbEnfants = STATE.teams.filter(t=>t.categorie==='enfant').length;
  const tabs = `<div class="tabbar">
    <button class="${classementCat==='adulte'?'active':''}" onclick="setClassementCat('adulte')">🧑 Adultes (${nbAdultes})</button>
    <button class="${classementCat==='enfant'?'active':''}" onclick="setClassementCat('enfant')">🧒 Enfants (${nbEnfants})</button>
  </div>`;
  const teams = STATE.teams.filter(t=>t.categorie===classementCat)
    .map(t=>({...t, total: ptsTotal(t)}))
    .sort((a,b)=>b.total-a.total);
  const rows = teams.map((t,i)=>{
    const rank=i+1;
    const rc = rank===1?'top1':rank===2?'top2':rank===3?'top3':'';
    const medal = rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':rank;
    const bd = pointsBreakdown(t);
    return `<div class="rank-row ${mon&&mon.id===t.id?'me':''}">
      <div class="rank-num ${rc}">${medal}</div>
      <div class="team-dot" style="background:${t.couleur}"></div>
      <div class="rank-name">${t.emoji} ${escapeHtml(t.nom)}</div>
      <div class="rank-pts">${t.total} pt${t.total>1?'s':''}</div>
    </div>
    <details class="breakdown" style="margin:-4px 0 8px 40px">
      <summary>Détail</summary>
      ${bd.map(b=>`<div class="bd-line"><span>${b.label}</span><span>${b.pts} pt${b.pts>1?'s':''}</span></div>`).join('')}
    </details>`;
  }).join('');
  return `
  <div class="section-title">🏆 Classement</div>
  <div class="card">${tabs}${rows}</div>`;
}

      <label>Code PIN</label>
      <input type="password" id="pin-input" inputmode="numeric" placeholder="••••">
      <button class="btn" onclick="checkPin()">Valider</button>
    </div>`;
  }
  adminTab = adminTab || 'scores';
  const tabs = [['scores','📊 Scores'],['apero','🍹 Apéro'],['equipes','👥 Équipes'],['contenu','✏️ Contenu'],['partage','📡 Partage'],['parametres','🔧 Réglages']];
  const tabbar = `<div class="tabbar">${tabs.map(([k,l])=>`<button class="${adminTab===k?'active':''}" onclick="setAdminTab('${k}')">${l}</button>`).join('')}</div>`;
  let body='';
  if(adminTab==='scores') body = renderAdminScores();
  else if(adminTab==='apero') body = renderAdminApero();
  else if(adminTab==='equipes') body = renderAdminEquipes();
  else if(adminTab==='contenu') body = renderAdminContenu();
  else if(adminTab==='partage') body = renderAdminPartage();
  else if(adminTab==='parametres') body = renderAdminParametres();
  return `<div class="card"><h2>⚙️ Espace Jessica</h2>${tabbar}</div>${body}`;
}
function setAdminTab(t){ adminTab=t; render(); }

function cordeSelect(teamId, manche, valeur){
  const opt = (v, lbl) => `<option value="${v}" ${valeur===(v||null)?'selected':''}>${lbl}</option>`;
  return `<select onchange="updCorde('${teamId}','${manche}',this.value||null)">
    ${opt('', 'Non joué')}
    ${opt('victoire', 'Victoire (3 pts)')}
    ${opt('nul', 'Match nul (1 pt)')}
    ${opt('defaite', 'Défaite (0 pt)')}
  </select>`;
}
function renderAdminScores(){
  return STATE.teams.map(t=>{
    const sc = STATE.scores[t.id];
    const nbCat = STATE.teams.filter(x=>x.categorie===t.categorie).length;
    const rangsUtilises = STATE.teams.filter(x=>x.categorie===t.categorie && x.id!==t.id)
      .map(x=>({t:x, r:STATE.scores[x.id] && STATE.scores[x.id].photoRang})).filter(x=>x.r);
    const rangsInfo = rangsUtilises.length
      ? `<p class="muted" style="font-size:12px;margin:2px 0 8px">Déjà utilisés dans cette catégorie : ${rangsUtilises.map(x=>`${x.r} (${escapeHtml(x.t.nom)})`).join(', ')}</p>`
      : '';
    return `<div class="team-admin-card">
      <h4><span class="team-dot" style="background:${t.couleur}"></span>${t.emoji} ${escapeHtml(t.nom)} <span class="muted">(${t.categorie})</span> — <b>${ptsTotal(t)} pts</b></h4>
      <div class="checkline"><input type="checkbox" ${sc.apero.valide?'checked':''} onchange="setApero('${t.id}','valide',this.checked)"> Défi apéro validé (5 pts)</div>
      <label>Photo — rang de l'équipe dans sa catégorie (1 = meilleure photo, sur ${nbCat})</label>
      <input type="number" min="1" max="${nbCat}" value="${sc.photoRang||''}" placeholder="ex: 1" onchange="updScore('${t.id}','photoRang',this.value===''?null:Number(this.value))">
      ${rangsInfo}
      <label>Tir à la corde — Manche 1</label>
      ${cordeSelect(t.id,'manche1',sc.corde.manche1)}
      <label>Tir à la corde — Manche 2</label>
      ${cordeSelect(t.id,'manche2',sc.corde.manche2)}
      <label>Questionnaire — nombre de bonnes réponses (sur 20, 1 pt chacune)</label>
      <input type="number" min="0" max="20" value="${sc.quiz===null?'':sc.quiz}" placeholder="ex: 17" onchange="updScore('${t.id}','quiz',this.value===''?null:Number(this.value))">
      <label>Blind test — nombre de bonnes réponses (sur ${t.categorie==='adulte'?20:10}, 1 pt chacune)</label>
      <input type="number" min="0" max="${t.categorie==='adulte'?20:10}" value="${sc.blindtest===null?'':sc.blindtest}" placeholder="ex: 14" onchange="updScore('${t.id}','blindtest',this.value===''?null:Number(this.value))">
      <label>Cocktail — ingrédients de base trouvés (0 à 5, 1 pt chacun)</label>
      <input type="number" min="0" max="5" value="${sc.cocktail.ingredients}" onchange="updCocktail('${t.id}','ingredients',this.value)">
      <div class="checkline"><input type="checkbox" ${sc.cocktail.bonus?'checked':''} onchange="updCocktail('${t.id}','bonus',this.checked)"> Ingrédient bonus trouvé (+3 pts)</div>
    </div>`;
  }).join('');
}
function updScore(teamId, field, value){
  STATE.scores[teamId][field] = value;
  persist(); render();
}
function updCorde(teamId, field, value){
  STATE.scores[teamId].corde[field] = value;
  persist(); render();
}
function updCocktail(teamId, field, value){
  STATE.scores[teamId].cocktail[field] = field==='ingredients' ? Number(value) : value;
  persist(); render();
}

function renderAdminApero(){
  return `<div class="card"><p class="muted">💡 Chaque équipe voit son défi apéro dès qu'elle ouvre l'appli. Une fois le défi réalisé, cliquez sur "Valider" pour attribuer les 5 points.</p></div>` +
  STATE.teams.map(t=>{
    const sc = STATE.scores[t.id];
    const defiTxt = STATE.contenu.apero[t.id] || '';
    let statusBox, actions;
    if(sc.apero.valide){
      statusBox = `<div class="bareme-box">✅ Défi validé (5 pts)</div>`;
      actions = `<button class="btn small secondary" onclick="resetApero('${t.id}')">↺ Réinitialiser</button>`;
    } else {
      statusBox = `<div class="rules-box muted">⏳ Défi visible par l'équipe, en attente de réalisation.</div>`;
      actions = `<button class="btn ok" onclick="setApero('${t.id}','valide',true)">✔️ Valider (5 pts)</button>`;
    }
    return `<div class="team-admin-card">
      <h4><span class="team-dot" style="background:${t.couleur}"></span>${t.emoji} ${escapeHtml(t.nom)}</h4>
      <label>Défi apéro de l'équipe</label>
      <textarea onchange="updAperoTexte('${t.id}',this.value)">${escapeHtml(defiTxt)}</textarea>
      ${statusBox}
      ${actions}

  }).join('');
}
function setApero(teamId, field, value){
  STATE.scores[teamId].apero[field] = value;
  if(field==='revele' && value===false) STATE.scores[teamId].apero.valide = false;
  persist(); render();
}
function resetApero(teamId){
  STATE.scores[teamId].apero.revele = false;
  STATE.scores[teamId].apero.valide = false;
  persist(); render();
}
function updAperoTexte(teamId, value){
  STATE.contenu.apero[teamId] = value;
  persist(); render();
}

function renderAdminEquipes(){
  return `<div class="card">
    <p class="muted">Vous pouvez ajuster le nom et la couleur de chaque équipe.</p>
    ${STATE.teams.map(t=>`
      <div class="row" style="margin-bottom:10px;align-items:center">
        <input type="color" style="flex:0 0 46px;padding:2px;height:40px" value="${toHex(t.couleur)}" onchange="updTeam('${t.id}','couleur',this.value)">

        <span class="muted" style="flex:0 0 54px;text-align:right">${t.categorie}</span>
      </div>`).join('')}
  </div>`;
}
function toHex(c){ return c.startsWith('#')?c:'#ffffff'; }
function updTeam(teamId, field, value){
  const t = STATE.teams.find(x=>x.id===teamId);
  t[field]=value; persist(); render();
}

function renderAdminContenu(){
  const st = STATE.contenu;
  return `<div class="card">
    <p class="muted">✏️ Le texte des défis apéro (un par équipe) se modifie directement dans l'onglet "🍹 Apéro".</p>
  </div>
  <div class="card">
    <h3>🍸 Cocktail mystère</h3>
    <label>5 ingrédients de base</label>
    ${st.cocktailBase.map((s,i)=>`<input type="text" style="margin-bottom:6px" value="${escapeHtml(s)}" onchange="updContenuList('cocktailBase',${i},this.value)">`).join('')}

function updContenuList(key, idx, value){ STATE.contenu[key][idx]=value; syncDefRegles(); persist(); render(); }
function updContenuField(key, value){ STATE.contenu[key]=value; syncDefRegles(); persist(); render(); }
function syncDefRegles(){
  DEFIS_DEF.find(d=>d.id==='quiz').regles = STATE.contenu.quizInfo;
  DEFIS_DEF.find(d=>d.id==='blindtest').regles = STATE.contenu.blindtestInfo;
}

function guestUrl(){
  const base = location.origin + location.pathname;
  if(!STATE.sync.bucket) return base;
  return `${base}?g=${encodeURIComponent(STATE.sync.bucket)}&p=${encodeURIComponent(STATE.sync.fbProject)}&k=${encodeURIComponent(STATE.sync.fbKey)}`;
}
function renderAdminPartage(){
  const url = guestUrl();
  const qrSrc = `https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=${encodeURIComponent(url)}`;
  let liveBlock;
  if(STATE.sync.mode==='live' && STATE.sync.bucket){
    liveBlock = `
      <div class="bareme-box">🟢 Synchro en direct activée. Les invités qui scannent le QR code ci-dessous verront le classement se mettre à jour automatiquement.</div>
      <div class="center"><div class="qrbox"><img src="${qrSrc}" width="220" height="220" alt="QR code"></div></div>
      <label>Lien à partager / QR code</label>
      <div class="link-note">${url}</div>
      <button class="btn small secondary" style="width:100%;margin-top:10px" onclick="copyLink()">📋 Copier le lien</button>
      <button class="btn small" style="width:100%;margin-top:8px" onclick="testConnexion()">🔄 Tester la connexion</button>
      <button class="btn small danger" style="width:100%;margin-top:8px" onclick="disableLive()">Repasser en mode local</button>
    `;
  } else {
    liveBlock = `
      <p class="muted">La synchro en direct utilise un projet <b>Firebase</b> gratuit (Google) — beaucoup plus fiable qu'un service anonyme. Il faut le créer une fois (5 minutes) :</p>
      <details style="margin-bottom:10px">
        <summary style="cursor:pointer;font-weight:700;color:var(--grad1)">📖 Comment créer mon projet Firebase (5 min)</summary>
        <div class="rules-box">
          1. Va sur <b>console.firebase.google.com</b> et connecte-toi avec un compte Google.<br>
          2. Clique "Ajouter un projet", donne-lui un nom (ex: "fete-agnes"), tu peux désactiver Google Analytics, puis "Créer le projet".<br>
          3. Dans le menu de gauche : "Build" → "Firestore Database" → "Créer une base de données".<br>
          4. Choisis <b>"Démarrer en mode test"</b> (test mode), sélectionne une région proche (ex: eur3), puis "Activer".<br>
          5. Clique sur la roue crantée en haut à gauche → "Paramètres du projet".<br>
          6. Dans l'onglet "Général", descends jusqu'à "Vos applications", clique sur l'icône <b>&lt;/&gt;</b> (Web), donne un surnom, "Enregistrer l'application".<br>
          7. Un bloc de code apparaît avec <code>projectId</code> et <code>apiKey</code> : copie ces deux valeurs ci-dessous.
        </div>
      </details>
      <label>ID de projet Firebase (projectId)</label>
      <input type="text" id="fb-project" placeholder="ex: fete-agnes" value="${escapeHtml(STATE.sync.fbProject||'')}" onchange="updFbField('fbProject',this.value)">
      <label>Clé API Web Firebase (apiKey)</label>
      <input type="text" id="fb-key" placeholder="ex: AIzaSy..." value="${escapeHtml(STATE.sync.fbKey||'')}" onchange="updFbField('fbKey',this.value)">
      <button class="btn" style="margin-top:14px" onclick="enableLive()">🚀 Activer la synchro en direct</button>
    `;
  }
  return `<div class="card">
    <h3>📡 Partage & synchronisation</h3>
    ${liveBlock}
  </div>
  <div class="card">
    <h3>💾 Sauvegarde</h3>
    <button class="btn secondary" onclick="exportJson()">⬇️ Exporter les scores (JSON)</button>
    <label>Importer une sauvegarde</label>
    <input type="file" id="import-file" accept="application/json" onchange="importJson(event)">
  </div>
  <div class="card">
    <h3>⚠️ Zone danger</h3>
    <button class="btn danger" onclick="askResetAll()">Réinitialiser tous les scores</button>
    <div id="reset-confirm"></div>
  </div>`;
}
function updFbField(field, value){
  STATE.sync[field] = value.trim();
  saveLocal();
}
async function enableLive(){
  flash('Création en cours…');
  try{
    const bucket = await kvCreateBucket();
    STATE.sync.mode='live'; STATE.sync.bucket=bucket; STATE.sync.role='admin';
    persist();
    flash('✅ Synchro activée !');
    render();
  }catch(e){
    flash('❌ '+e.message);
  }
}
function disableLive(){
  STATE.sync.mode='local'; persist(); render();
}
async function testConnexion(){
  flash('Test en cours…');
  const ok = await kvPush();
  if(ok){
    const remote = await kvPull(STATE.sync.bucket);
    flash(remote ? '✅ Connexion OK' : '⚠️ Écriture OK, lecture impossible');
  } else {
    flash('❌ Échec de connexion (voir console)');
  }
}
function copyLink(){
  const url = guestUrl();
  navigator.clipboard?.writeText(url).then(()=>flash('🔗 Lien copié !')).catch(()=>flash(url));
}
function exportJson(){
  const blob = new Blob([JSON.stringify(STATE,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'agnes-42-5-ans-scores.json';
  a.click();
}
function importJson(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      let data = JSON.parse(reader.result);
      if(data && (data.v===3 || data.v===4)){
        data = migrateState(data);
        STATE = data; persist(); flash('✅ Sauvegarde importée'); render();
      } else { flash('❌ Fichier invalide'); }
    }catch(e){ flash('❌ Fichier invalide'); }
  };
  reader.readAsText(file);
}
let resetPending=false;
function askResetAll(){
  const box = document.getElementById('reset-confirm');
  if(!resetPending){
    resetPending=true;
    box.innerHTML = `<p class="muted">Confirmer la réinitialisation de TOUS les scores ?</p><button class="btn danger" onclick="doResetAll()">Oui, tout réinitialiser</button>`;
  }
}
function doResetAll(){
  STATE.scores = defaultScoresForTeams(STATE.teams);
  resetPending=false;
  persist(); flash('Scores réinitialisés'); render();
}

function renderAdminParametres(){
  return `<div class="card">
    <h3>🔧 Réglages généraux</h3>
    <label>Titre de la fête</label>
    <input type="text" value="${escapeHtml(STATE.titre)}" onchange="updRoot('titre',this.value)">
    <label>Code PIN admin</label>
    <input type="text" value="${escapeHtml(STATE.pin)}" onchange="updRoot('pin',this.value)">
    <button class="btn secondary" style="margin-top:16px" onclick="logoutAdmin()">🚪 Se déconnecter de l'admin</button>
  </div>`;
}
function updRoot(field,value){ STATE[field]=value; persist(); render(); }

/* =========================================================
   UTIL
========================================================= */
function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* =========================================================
   RENDER PRINCIPAL
========================================================= */
function render(){
  syncDefRegles();
  const route = currentRoute();
  const app = document.getElementById('app');
  if(route==='/' ) app.innerHTML = renderAccueil();
  else if(route==='/defis') app.innerHTML = renderDefisMenu();
  else if(route.startsWith('/defi/')) app.innerHTML = renderDefiPage(route.split('/')[2]);
  else if(route==='/classement') app.innerHTML = renderClassement();
  else if(route==='/equipe') app.innerHTML = renderEquipe();
  else if(route==='/admin') app.innerHTML = renderAdmin();
  else app.innerHTML = renderAccueil();
  renderBottomNav(route);
  renderSyncPill();
  window.scrollTo(0,0);
}

/* =========================================================
   CONFETTIS (page d'accueil)
========================================================= */
(function confettiFx(){
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  let pieces=[];
  function resize(){ canvas.width=innerWidth; canvas.height=innerHeight; }
  window.addEventListener('resize', resize); resize();
  const colors=['#f6c453','#c454b7','#6a3093','#f6a15a','#fff'];
  function burst(){
    pieces=[];
    for(let i=0;i<80;i++){
      pieces.push({
        x:Math.random()*canvas.width, y:-20-Math.random()*canvas.height*.5,
        vy:2+Math.random()*3, vx:-1+Math.random()*2,
        size:5+Math.random()*5, color:colors[i%colors.length],
        rot:Math.random()*360, vr:-6+Math.random()*12
      });
    }
    animate();
  }
  let raf;
  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive=false;
    pieces.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      if(p.y < canvas.height+20) alive=true;
      ctx.save();
      ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color;
      ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.6);
      ctx.restore();
    });
    if(alive) raf=requestAnimationFrame(animate);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  window.__partyConfetti = burst;
})();

/* =========================================================
   DÉMARRAGE
========================================================= */
init().then(()=>{
  if(currentRoute()==='/' && window.__partyConfetti) window.__partyConfetti();
});
